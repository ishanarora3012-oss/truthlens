services:
  api:
    build:
      context: .
    environment:
      TRUTHLENS_DATABASE_URL: postgresql+psycopg://truthlens:truthlens@db:5432/truthlens
      TRUTHLENS_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truthlens
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: truthlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens -d truthlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
